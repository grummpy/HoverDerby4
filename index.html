<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Hover Derby 4</title>
  <link rel="icon" href="assets/icon.jpg">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #07060f;
      overflow: hidden;
      color: #f4f1ff;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    noscript {
      display: block;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Hover Derby 4"></canvas>
  <noscript>Hover Derby 4 needs JavaScript. It runs fully offline once this page is open.</noscript>
  <script type="module" src="src/ui/main.js"></script>
</body>
</html>
